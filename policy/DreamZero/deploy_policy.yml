# DreamZero multi-agent (bimanual) policy adapter for RoboTwin.
#
# This is a thin WebSocket client. The heavy lifting (VLA forward,
# normalization, rolling history) lives in the bimanual server:
#   dreamzero/eval_utils/bimanual_policy_server.py
#
# Override server_host / server_port via env vars DREAMZERO_HOST,
# DREAMZERO_PORT in eval.sh, or via --overrides on the CLI.
server_host: 127.0.0.1
server_port: 5001
# How long to wait for the server to come up (model load can be slow).
connect_timeout: 600.0
# New DreamZero/RoboTwin checkpoints train with DreamZero relative-action
# joint offsets and the server returns absolute qpos targets. Legacy
# servers that do not advertise an action representation fall back to the
# old RoboTwin delta integration path.
action_mode: auto
# Clamp arm targets to Franka's physical joint limits and grippers to [0, 1].
clip_joint_targets: true
# Replan every N action steps. Each call executes only the first N
# targets from the model chunk and discards the rest.
replan_every: 8
# Print one compact action diagnostic every N server calls (0 disables).
debug_interval: 10
fallback_instruction: "use the two robot arms to complete the task"
